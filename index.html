<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spell to Impress</title>
<script>
/* Spell to Impress moved to https://bregan.org/impress/ on 2026-11-24 (the game itself is on the main branch).
   Saved progress belongs to a site's address, so this page hands over whatever this browser saved here, in the
   link's #carry= part, which browsers never send to a server. The new address merges it in. Nothing saved here
   is changed or deleted, so opening this page again is always safe. */
(function () {
  var to = 'https://bregan.org/impress/';
  try {
    var raw = localStorage.getItem('sti-progress-v3');
    if (raw) {
      var bytes = new TextEncoder().encode(raw), bin = '';
      for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      to += '#carry=' + btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }
  } catch (e) { /* storage blocked: just go */ }
  location.replace(to);
})();
</script>
<style>
  body { margin: 0; padding: 56px 16px; background: #fff0f6; color: #8a2a5c; text-align: center;
         font: 600 20px/1.5 system-ui, -apple-system, sans-serif; }
  a { color: #e2428c; }
</style>
</head>
<body>
<p>Spell to Impress has a new home:<br><a href="https://bregan.org/impress/">bregan.org/impress</a></p>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spell to Impress · Glam Doll</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--s:1}
  html,body{margin:0;height:100%;overflow:hidden}
  body{background:radial-gradient(130% 120% at 50% 45%,#5b2d4b 0%,#2c1526 58%,#1a0c16 100%)}
  #stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;
    transform:translate(-50%,-50%) scale(var(--s));
    box-shadow:0 0 0 1px rgba(255,190,220,.18),0 18px 60px rgba(0,0,0,.5);
    overflow:hidden;background:#f6ece4}
  #game{display:block;width:1280px;height:720px}
  #game text{font-family:'Fredoka','Baloo 2',system-ui,sans-serif}
  #game text.sans{font-family:'Nunito',system-ui,sans-serif}

  /* outfit layers: every clothing item is its own <g>, cross-faded by the root state */
  .oA,.oB{transition:opacity .28s ease}
  #game[data-outfit="a"] .oB,#game[data-outfit="b"] .oA{opacity:0}

  /* twinkles */
  .tw{transform-box:fill-box;transform-origin:center;animation:tw 3.2s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.15;transform:scale(.45) rotate(0deg)}45%{opacity:1;transform:scale(1) rotate(20deg)}60%{opacity:.9;transform:scale(.9) rotate(25deg)}}
  .glint{transform-box:fill-box;transform-origin:center;animation:glint 2.4s ease-in-out infinite}
  @keyframes glint{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}

  /* "Spell it!" highlight pulse + float */
  .pulse{animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
  .bob{animation:bob 3s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .bob2{animation:bob 3.6s ease-in-out .8s infinite}

  /* candy button */
  #btn{cursor:pointer;outline:none}
  #btn .face{transition:transform .12s ease}
  #btn:hover .face{transform:translateY(-1px)}
  #btn:active .face{transform:translateY(2px)}
  #btn:focus-visible .ring{opacity:1}

  /* outfit-change sparkle burst */
  #burst{opacity:0;pointer-events:none}
  #burst.go{animation:burst .9s ease-out}
  #burst.go .bs{animation:bs .9s ease-out both}
  @keyframes burst{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
  .bs{transform-box:fill-box;transform-origin:center}
  @keyframes bs{0%{transform:scale(.2) rotate(0)}50%{transform:scale(1.15) rotate(40deg)}100%{transform:scale(.6) rotate(80deg)}}
  #flash{opacity:0;pointer-events:none}
  #flash.go{animation:flash .9s ease-out}
  @keyframes flash{0%{opacity:0}30%{opacity:.92}100%{opacity:0}}
</style>
</head>

    <text x="1158" y="681" text-anchor="middle" font-size="20" font-weight="700" fill="#fff" stroke="#c8327a" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Try another outfit</text>
  </g>
</g>

<script>
(function(){
  var NS = 'http://www.w3.org/2000/svg';
  var svg = document.getElementById('game');
  function el(tag, attrs, parent){
    var n = document.createElementNS(NS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }
  function f(v){ return (Math.round(v * 10) / 10).toString(); }
  // deterministic noise so every load (and screenshot) looks the same
  var seed = 7;
  function rnd(){ seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
  // smooth Catmull-Rom spline through points
  function cr(pts, move){
    var d = (move ? 'M' : 'L') + f(pts[0][0]) + ' ' + f(pts[0][1]);
    for (var i = 0; i < pts.length - 1; i++) {
      var p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
      d += 'C' + f(p1[0] + (p2[0] - p0[0]) / 6) + ' ' + f(p1[1] + (p2[1] - p0[1]) / 6) + ' ' +
                 f(p2[0] - (p3[0] - p1[0]) / 6) + ' ' + f(p2[1] - (p3[1] - p1[1]) / 6) + ' ' + f(p2[0]) + ' ' + f(p2[1]);
    }
    return d;
  }

  /* ---- uniform letterboxed scaling ---- */
  function fit(){
    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    document.documentElement.style.setProperty('--s', s);
  }
  window.addEventListener('resize', fit); fit();

  /* ---- start outfit from URL (?outfit=b) ---- */
  var q = new URLSearchParams(location.search);
  if ((q.get('outfit') || '').toLowerCase() === 'b') svg.setAttribute('data-outfit', 'b');

  /* ---- long soft waves: each lock is a tapered ribbon along a sine centre-line ---- */
  function lock(o, parent){
    var N = 30, C = [], W = [], Nn = [], Lp = [], Rp = [], i;
    for (i = 0; i <= N; i++) {
      var s = i / N, env = Math.min(1, 0.2 + s * 1.6);
      C.push([o.x + o.drift * s * s + o.amp * env * Math.sin(2 * Math.PI * s * o.len / o.wl + o.ph), o.y + s * o.len]);
      var w = o.w0 * (1 - s) + o.w1 * s;
      if (s > 0.76) w *= Math.max(0.06, Math.pow((1 - s) / 0.24, 0.75));
      if (s < 0.1) w *= 0.3 + s / 0.1 * 0.7;
      W.push(w / 2);
    }
    for (i = 0; i <= N; i++) {
      var a = C[Math.max(0, i - 1)], b = C[Math.min(N, i + 1)], dx = b[0] - a[0], dy = b[1] - a[1], m = Math.hypot(dx, dy);
      Nn.push([dy / m, -dx / m]);
      Lp.push([C[i][0] - Nn[i][0] * W[i], C[i][1] - Nn[i][1] * W[i]]);
      Rp.push([C[i][0] + Nn[i][0] * W[i], C[i][1] + Nn[i][1] * W[i]]);
    }
    var g = el('g', {}, parent);
    el('path', {d: cr(Lp, true) + cr(Rp.slice().reverse(), false) + 'Z', fill: o.col}, g);
    var edge = [];
    for (i = 2; i <= N - 2; i++) edge.push([Rp[i][0] - Nn[i][0] * 1.2, Rp[i][1] - Nn[i][1] * 1.2]);
    el('path', {d: cr(edge, true), fill: 'none', stroke: o.dark, 'stroke-width': '1.8', 'stroke-opacity': '.5', 'stroke-linecap': 'round', filter: 'url(#fSoft1)'}, g);
    [-0.35, 0.3].forEach(function(k){
      var pts = [];
      for (var i = 3; i <= N - 4; i++) pts.push([C[i][0] + Nn[i][0] * W[i] * k, C[i][1] + Nn[i][1] * W[i] * k]);
      el('path', {d: cr(pts, true), fill: 'none', stroke: o.fine, 'stroke-width': '.8', 'stroke-opacity': '.5', 'stroke-linecap': 'round'}, g);
    });
    var run = [];
    function flush(){
      if (run.length > 3) {
        var L2 = [], R2 = [], M2 = [], n = run.length;
        run.forEach(function(r, j){
          var t = j / (n - 1), w = r[2] * 0.42 * Math.pow(Math.sin(Math.PI * t), 0.8);
          L2.push([r[0] - r[3] * w, r[1] - r[4] * w]); R2.push([r[0] + r[3] * w, r[1] + r[4] * w]);
          if (t > 0.2 && t < 0.8) M2.push([r[0] - r[3] * r[2] * 0.12, r[1] - r[4] * r[2] * 0.12]);
        });
        el('path', {d: cr(L2, true) + cr(R2.reverse(), false) + 'Z', fill: o.light, opacity: '.6', filter: 'url(#fSoft1)'}, g);
        if (M2.length > 1) el('path', {d: cr(M2, true), fill: 'none', stroke: o.shine, 'stroke-width': '1.1', 'stroke-opacity': '.8', 'stroke-linecap': 'round'}, g);
      }
      run = [];
    }
    for (i = 1; i < N - 3; i++) {
      if (C[i + 1][0] - C[i - 1][0] < -0.3) run.push([C[i][0] - Nn[i][0] * W[i] * 0.15, C[i][1] - Nn[i][1] * W[i] * 0.15, W[i], Nn[i][0], Nn[i][1]]);
      else flush();
    }
    flush();
  }
  var back = document.getElementById('hairBackLocks');
  var BX = [-41, -35, -25, -13, 0, 13, 25, 35, 41], BY = [22, 12, 5, 1, -1, 1, 5, 12, 22];
  BX.forEach(function(x, i){
    var c = i - 4;
    lock({x: x, y: BY[i], len: 288 - BY[i] + (i % 2 ? 6 : -2), amp: 6.5, wl: 74, ph: 0.4 * i + (i % 3) * 0.3, w0: 24, w1: 20, drift: c * 5.2,
          col: 'url(#gLockB)', dark: '#160904', fine: '#5e3824', light: '#7a4a2e', shine: '#b47c56'}, back);
  });
  var front = document.getElementById('hairFrontLocks');
  [
    {x: -50, y: 60, len: 140, amp: 6, wl: 66, ph: 0.7, w0: 16, w1: 12, drift: 2},
    {x: -40, y: 46, len: 168, amp: 6.5, wl: 70, ph: 1.3, w0: 21, w1: 15, drift: 10},
    {x: 49, y: 56, len: 122, amp: 5.5, wl: 64, ph: 2.6, w0: 14, w1: 10, drift: 4},
    {x: 40, y: 44, len: 152, amp: 6, wl: 68, ph: 2.1, w0: 19, w1: 14, drift: -3}
  ].forEach(function(o){
    o.col = 'url(#gLockF)'; o.dark = '#1e0d06'; o.fine = '#7a4c32'; o.light = '#9a6644'; o.shine = '#e0ae88';
    lock(o, front);
  });

  /* ---- plush scalloped rug edge ---- */
  var rugEdge = document.getElementById('rugEdge');
  for (var ri = 0; ri < 56; ri++) {
    var ra = ri / 56 * Math.PI * 2;
    el('ellipse', {cx: f(470 + Math.cos(ra) * 214), cy: f(678 + Math.sin(ra) * 36), rx: '9', ry: '5.2'}, rugEdge);
  }

  /* ---- warm wood floor planks in perspective ---- */
  var planks = document.getElementById('planks');
  var VPY = 230, Y0 = 496, Y1 = 720, k = (Y1 - VPY) / (Y0 - VPY);
  var xs = [];
  for (var x0 = -360; x0 <= 1640; x0 += 44) xs.push(x0);
  xs.forEach(function(x0, i){
    if (i < xs.length - 1) el('path', {d: 'M' + x0 + ' ' + Y0 + 'L' + xs[i + 1] + ' ' + Y0 + 'L' + f(640 + (xs[i + 1] - 640) * k) + ' ' + Y1 + 'L' + f(640 + (x0 - 640) * k) + ' ' + Y1 + 'Z',
      stroke: 'none', fill: rnd() < 0.5 ? '#fff3e6' : '#5b3322', 'fill-opacity': f(0.03 + rnd() * 0.07)}, planks);
    el('path', {d: 'M' + x0 + ' ' + Y0 + 'L' + f(640 + (x0 - 640) * k) + ' ' + Y1}, planks);
    if (i < xs.length - 1) {
      for (var j = 0; j < 2; j++) {
        var y = Y0 + 14 + rnd() * (Y1 - Y0 - 20), fy = (y - VPY) / (Y0 - VPY);
        el('path', {d: 'M' + f(640 + (x0 - 640) * fy) + ' ' + f(y) + 'H' + f(640 + (xs[i + 1] - 640) * fy), 'stroke-opacity': '.2'}, planks);
      }
    }
  });

  /* ---- potted palm: slim trunks with a crown of long, broad, glossy leaves ---- */
  var fronds = document.getElementById('fronds');
  el('path', {d: 'M936 498C933 470 936 438 943 404', fill: 'none', stroke: '#8a6a52', 'stroke-width': '7', 'stroke-linecap': 'round'}, fronds);
  el('path', {d: 'M946 498C951 476 953 456 951 434', fill: 'none', stroke: '#7c5e48', 'stroke-width': '6', 'stroke-linecap': 'round'}, fronds);
  for (var tr = 0; tr < 7; tr++) el('path', {d: 'M' + f(931.5 + tr * 1.1) + ' ' + (488 - tr * 12) + 'h8', stroke: '#6b4f3b', 'stroke-width': '1.4', 'stroke-opacity': '.6'}, fronds);
  function leaf(bx, by, deg, L, W, back){
    var a = deg * Math.PI / 180, c = Math.cos(a), s = Math.sin(a), droop = L * (0.12 + 0.5 * Math.abs(c));
    var p0 = {x: bx, y: by}, p2 = {x: bx + c * L, y: by + s * L + droop}, p1 = {x: bx + c * L * 0.5, y: by + s * L * 0.5 - droop * 0.3};
    var N = 18, Cc = [], Lp = [], Rp = [], Hl = [];
    for (var i = 0; i <= N; i++) {
      var t = i / N, u = 1 - t;
      var x = u*u*p0.x + 2*u*t*p1.x + t*t*p2.x, y = u*u*p0.y + 2*u*t*p1.y + t*t*p2.y;
      var dx = 2*u*(p1.x - p0.x) + 2*t*(p2.x - p1.x), dy = 2*u*(p1.y - p0.y) + 2*t*(p2.y - p1.y), m = Math.hypot(dx, dy), nx = -dy / m, ny = dx / m;
      var w = W * Math.pow(Math.sin(Math.PI * Math.min(1, t * 1.02)), 0.7);
      Cc.push([x, y]); Lp.push([x + nx * w, y + ny * w]); Rp.push([x - nx * w * 0.9, y - ny * w * 0.9]);
      if (t > 0.15 && t < 0.8) Hl.push([x + nx * w * 0.45, y + ny * w * 0.45]);
    }
    var g = el('g', {}, fronds);
    el('path', {d: cr(Lp, true) + cr(Rp.slice().reverse(), false) + 'Z', fill: back ? '#3f8460' : 'url(#gLeaf)', stroke: back ? '#2f6a4a' : '#2a6b49', 'stroke-width': '.8'}, g);
    el('path', {d: cr(Rp.slice(1, N), true) + cr(Cc.slice(1, N).reverse(), false) + 'Z', fill: '#1d5a3a', opacity: back ? '.25' : '.22'}, g);
    el('path', {d: cr(Cc.slice(1, N - 1), true), fill: 'none', stroke: back ? '#7cbf98' : '#d8f6e2', 'stroke-width': '1.3', 'stroke-opacity': '.75', 'stroke-linecap': 'round'}, g);
    if (!back) el('path', {d: cr(Hl, true), fill: 'none', stroke: '#fff', 'stroke-width': f(W * 0.35), 'stroke-opacity': '.32', 'stroke-linecap': 'round', filter: 'url(#fSoft1)'}, g);
  }
  [[-112, 112, 1], [-72, 118, 1], [-150, 104, 1], [-34, 104, 1], [-92, 92, 1]].forEach(function(l){ leaf(943, 404, l[0], l[1], 15, l[2]); });
  [[-176, 92], [-4, 96], [-128, 112], [-54, 112], [-160, 108], [-20, 108]].forEach(function(l){ leaf(943, 404, l[0], l[1], 16, 0); });
  [[-150, 74], [-28, 78], [-100, 64]].forEach(function(l){ leaf(951, 436, l[0], l[1], 13, 0); });

  /* ---- navy gown: tiered satin flounces (outfit B) ---- */
  var tiers = document.getElementById('gownTiers');
  [ // top y, bottom y, half-width top, half-width bottom, flounces
    {y0: 420, y1: 506, w0: 100, w1: 142, n: 10},
    {y0: 340, y1: 438, w0: 74, w1: 116, n: 9},
    {y0: 264, y1: 362, w0: 50, w1: 92, n: 8},
    {y0: 205, y1: 286, w0: 27, w1: 66, n: 7}
  ].forEach(function(r, ti){
    var cx = 1, g = el('g', {}, tiers), dip = 13, step = 2 * r.w1 / r.n, i;
    var h = r.y1 - r.y0;
    var top = 'M' + (cx - r.w0) + ' ' + r.y0 + 'L' + (cx + r.w0) + ' ' + r.y0 +
      'C' + (cx + r.w0 + 14) + ' ' + f(r.y0 + h * 0.25) + ' ' + (cx + r.w1 + 3) + ' ' + f(r.y1 - h * 0.35) + ' ' + (cx + r.w1) + ' ' + r.y1;
    var close = 'C' + (cx - r.w1 - 3) + ' ' + f(r.y1 - h * 0.35) + ' ' + (cx - r.w0 - 14) + ' ' + f(r.y0 + h * 0.25) + ' ' + (cx - r.w0) + ' ' + r.y0 + 'Z';
    var hem = '', lin = '';
    for (i = r.n; i > 0; i--) {
      var xa = cx - r.w1 + i * step, xb = xa - step, front = (i + ti) % 2 === 0, yy = front ? r.y1 + dip : r.y1 - 1;
      hem += 'C' + f(xa - step * 0.12) + ' ' + yy + ' ' + f(xb + step * 0.12) + ' ' + yy + ' ' + f(xb) + ' ' + r.y1;
      lin += 'Q' + f((xa + xb) / 2) + ' ' + (r.y1 + dip * 0.85) + ' ' + f(xb) + ' ' + r.y1;
    }
    if (ti > 0) el('path', {d: top + hem + close, fill: '#05081a', opacity: '.5', transform: 'translate(0 7)', filter: 'url(#fSoft2)'}, g);
    el('path', {d: top + lin + close, fill: '#0c112c'}, g);
    el('path', {d: top + hem + close, fill: 'url(#gNavyTier)'}, g);
    el('path', {d: top + hem + close, fill: 'url(#gShadeX)', opacity: '.85'}, g);
    for (var j = 0; j <= r.n; j++) {
      var xb2 = cx - r.w1 + j * step, xt = cx - r.w0 + j * (2 * r.w0 / r.n), lit = 1 - j / r.n;
      if (j > 0 && j < r.n) {
        el('path', {d: 'M' + f(xt) + ' ' + (r.y0 + 6) + 'C' + f(xt + (xb2 - xt) * 0.1) + ' ' + f((r.y0 + r.y1) / 2) + ' ' + f(xb2) + ' ' + (r.y1 - 22) + ' ' + f(xb2) + ' ' + (r.y1 + 1),
          fill: 'none', stroke: '#070b22', 'stroke-width': '2.4', 'stroke-opacity': '.6', 'stroke-linecap': 'round'}, g);
      }
      if (j < r.n) {
        var xm = xb2 + step / 2, xtm = xt + r.w0 / r.n, isFront = (j + 1 + ti) % 2 === 0;
        if (isFront) {
          el('path', {d: 'M' + f(xtm) + ' ' + (r.y0 + 10) + 'C' + f(xtm + (xm - xtm) * 0.1) + ' ' + f((r.y0 + r.y1) / 2) + ' ' + f(xm) + ' ' + (r.y1 - 20) + ' ' + f(xm) + ' ' + (r.y1 + dip * 0.6),
            fill: 'none', stroke: '#b4c5f7', 'stroke-width': f(4 + 6 * lit), 'stroke-opacity': f(0.1 + 0.45 * lit), 'stroke-linecap': 'round', filter: 'url(#fSoft2)'}, g);
          el('path', {d: 'M' + f(xtm) + ' ' + (r.y0 + 16) + 'C' + f(xtm + (xm - xtm) * 0.1) + ' ' + f((r.y0 + r.y1) / 2) + ' ' + f(xm) + ' ' + (r.y1 - 22) + ' ' + f(xm) + ' ' + (r.y1 + dip * 0.3),
            fill: 'none', stroke: '#dbe4ff', 'stroke-width': '1', 'stroke-opacity': f(0.15 + 0.5 * lit), 'stroke-linecap': 'round'}, g);
          el('path', {d: 'M' + f(xb2 + 2) + ' ' + (r.y1 + 2) + 'Q' + f(xm) + ' ' + (r.y1 + dip + 1.5) + ' ' + f(xb2 + step - 2) + ' ' + (r.y1 + 2),
            fill: 'none', stroke: '#8ea2e6', 'stroke-width': '1.6', 'stroke-opacity': f(0.4 + 0.45 * lit)}, g);
        } else {
          el('path', {d: 'M' + f(xtm) + ' ' + (r.y0 + 12) + 'C' + f(xtm) + ' ' + f((r.y0 + r.y1) / 2) + ' ' + f(xm) + ' ' + (r.y1 - 20) + ' ' + f(xm) + ' ' + (r.y1 - 2),
            fill: 'none', stroke: '#060a20', 'stroke-width': '5', 'stroke-opacity': '.35', 'stroke-linecap': 'round', filter: 'url(#fSoft1)'}, g);
        }
      }
    }
    // ruffled trim: little waves riding each flounce edge
    for (i = r.n; i > 0; i--) {
      var xa3 = cx - r.w1 + i * step, xb3 = xa3 - step, fr = (i + ti) % 2 === 0, yy3 = fr ? r.y1 + dip : r.y1 - 1;
      var P = [[xa3, r.y1], [xa3 - step * 0.12, yy3], [xb3 + step * 0.12, yy3], [xb3, r.y1]], pts3 = [];
      for (var q2 = 0; q2 <= 6; q2++) {
        var t3 = q2 / 6, u3 = 1 - t3;
        pts3.push([u3*u3*u3*P[0][0] + 3*u3*u3*t3*P[1][0] + 3*u3*t3*t3*P[2][0] + t3*t3*t3*P[3][0],
                   u3*u3*u3*P[0][1] + 3*u3*u3*t3*P[1][1] + 3*u3*t3*t3*P[2][1] + t3*t3*t3*P[3][1]]);
      }
      var rd = 'M' + f(pts3[0][0]) + ' ' + f(pts3[0][1] - 2);
      for (q2 = 1; q2 < pts3.length; q2++) rd += 'Q' + f((pts3[q2 - 1][0] + pts3[q2][0]) / 2) + ' ' + f((pts3[q2 - 1][1] + pts3[q2][1]) / 2 + 3.2) + ' ' + f(pts3[q2][0]) + ' ' + f(pts3[q2][1] - 2);
      el('path', {d: rd, fill: 'none', stroke: fr ? '#7488d6' : '#2c3a78', 'stroke-width': '2', 'stroke-opacity': fr ? f(0.5 + 0.4 * (i / r.n)) : '.8', 'stroke-linejoin': 'round'}, g);
    }
    for (var s = 0; s < r.n * 2; s++) {
      var gx = cx + (rnd() * 2 - 1) * (r.w0 + (r.w1 - r.w0) * 0.6), gy = r.y0 + 8 + rnd() * (r.y1 - r.y0 - 4);
      el('circle', {cx: f(gx), cy: f(gy), r: f(0.6 + rnd() * 0.7), fill: '#e8eeff', opacity: f(0.4 + rnd() * 0.5)}, g);
    }
  });

  /* ---- countdown 09:24 ---- */
  var left = 9 * 60 + 24, timer = document.getElementById('timer');
  setInterval(function(){
    left = Math.max(0, left - 1);
    var m = Math.floor(left / 60), s2 = left % 60;
    timer.textContent = (m < 10 ? '0' : '') + m + ':' + (s2 < 10 ? '0' : '') + s2;
  }, 1000);

  /* ---- blink every 3–5 s ---- */
  var blinkAnims = document.querySelectorAll('.blinker > animateTransform');
  function blink(){
    blinkAnims.forEach(function(a){ try { a.beginElement(); } catch (e) {} });
    setTimeout(blink, 3000 + Math.random() * 2000);
  }
  setTimeout(blink, 2300);

  /* ---- outfit toggle with sparkle burst ---- */
  var btn = document.getElementById('btn'), burst = document.getElementById('burst'), flash = document.getElementById('flash');
  function toggle(){
    [burst, flash].forEach(function(n){ n.classList.remove('go'); void n.getBoundingClientRect(); n.classList.add('go'); });
    setTimeout(function(){
      svg.setAttribute('data-outfit', svg.getAttribute('data-outfit') === 'a' ? 'b' : 'a');
    }, 220);
  }
  btn.addEventListener('click', toggle);
  btn.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
})();

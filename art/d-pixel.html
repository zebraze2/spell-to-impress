<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Boutique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiny5&family=Jersey+10&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b1d29; }
  body { display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; line-height: 0; }
  #screen { display: block; image-rendering: pixelated; }
  #outfitBtn { position: absolute; margin: 0; padding: 0; border: 0; background: transparent; cursor: pointer; color: transparent; font-size: 1px; overflow: hidden; border-radius: 4px; }
  #outfitBtn:focus-visible { outline: 3px solid #fff3b0; outline-offset: 2px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="screen" width="320" height="180" role="img" aria-label="Spell to Impress: pixel-art boutique dressing room, theme Garden Party"></canvas>
  <button id="outfitBtn" type="button">Try another outfit</button>
</div>
<script>
(() => {
'use strict';
const NW = 320, NH = 180, INK = '#2a1e26';

/* ======================================================================
   Pix toolkit: the same little kit Wordhollow uses (pix.js), plus a few
   helpers for capsule limbs, row tables and layered compositing.
   ====================================================================== */
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const _rgb = {};
function rgba(c) { if (_rgb[c]) return _rgb[c]; const h = c.slice(1); return (_rgb[c] = [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16), h.length > 6 ? parseInt(h.slice(6, 8), 16) : 255]); }
const hex2 = n => Math.max(0, Math.min(255, Math.round(n))).toString(16).padStart(2, '0');
function shade(c, amt) { const [r, g, b] = rgba(c), t = amt < 0 ? 0 : 255, k = Math.abs(amt); return '#' + hex2(r + (t - r) * k) + hex2(g + (t - g) * k) + hex2(b + (t - b) * k); }
function mix(c1, c2, k) { const a = rgba(c1), b = rgba(c2); return '#' + hex2(a[0] + (b[0] - a[0]) * k) + hex2(a[1] + (b[1] - a[1]) * k) + hex2(a[2] + (b[2] - a[2]) * k); }
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };

class Pix {
  constructor(w, h) { this.w = w; this.h = h; this.d = new Array(w * h).fill(null); }
  in(x, y) { return x >= 0 && y >= 0 && x < this.w && y < this.h; }
  set(x, y, c) { x = Math.round(x); y = Math.round(y); if (this.in(x, y)) this.d[y * this.w + x] = c; }
  get(x, y) { x = Math.round(x); y = Math.round(y); return this.in(x, y) ? this.d[y * this.w + x] : null; }
  rect(x, y, w, h, c) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) this.set(x + i, y + j, typeof c === 'function' ? c(x + i, y + j) : c); }
  ell(cx, cy, rx, ry, c, test) {
    for (let y = Math.floor(cy - ry - 1); y <= cy + ry + 1; y++)
      for (let x = Math.floor(cx - rx - 1); x <= cx + rx + 1; x++) {
        const dx = (x + .5 - cx) / rx, dy = (y + .5 - cy) / ry;
        if (dx * dx + dy * dy <= 1 && (!test || test(x, y, dx, dy))) { const v = typeof c === 'function' ? c(x, y, dx, dy) : c; if (v) this.set(x, y, v); }
      }
  }
  circ(cx, cy, r, c, test) { this.ell(cx, cy, r, r, c, test); }
  line(x0, y0, x1, y1, c) {
    x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
    const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let err = dx + dy;
    for (;;) { this.set(x0, y0, c); if (x0 === x1 && y0 === y1) break; const e2 = 2 * err; if (e2 >= dy) { err += dy; x0 += sx; } if (e2 <= dx) { err += dx; y0 += sy; } }
  }
  each(fn) { for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) { const c = this.d[y * this.w + x]; if (c) { const n = fn(x, y, c); if (n !== undefined) this.d[y * this.w + x] = n; } } }
  outline(c = INK, diag = false) {
    const src = this.d.slice(), W = this.w, solid = (x, y) => x >= 0 && y >= 0 && x < W && y < this.h && src[y * W + x] && rgba(src[y * W + x])[3] > 200;
    for (let y = 0; y < this.h; y++) for (let x = 0; x < W; x++) {
      if (src[y * W + x]) continue;
      if (solid(x - 1, y) || solid(x + 1, y) || solid(x, y - 1) || solid(x, y + 1) ||
        (diag && (solid(x - 1, y - 1) || solid(x + 1, y - 1) || solid(x - 1, y + 1) || solid(x + 1, y + 1)))) this.d[y * W + x] = c;
    }
    return this;
  }
  blit(o, ox, oy) { for (let y = 0; y < o.h; y++) for (let x = 0; x < o.w; x++) { const c = o.d[y * o.w + x]; if (c) this.set(ox + x, oy + y, c); } }
  clone() { const p = new Pix(this.w, this.h); p.d = this.d.slice(); return p; }
  canvas() {
    const cv = document.createElement('canvas'); cv.width = this.w; cv.height = this.h;
    const cx = cv.getContext('2d'), im = cx.createImageData(this.w, this.h);
    for (let i = 0; i < this.d.length; i++) { const c = this.d[i]; if (!c) continue; im.data.set(rgba(c), i * 4); }
    cx.putImageData(im, 0, 0);
    return cv;
  }
}

/* tapered capsule chain (limbs, locks). fn(x, y, u, s): u = -1 lit side .. +1 shadow side */
function chain(p, pts, fn) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const [x, y, r] of pts) { x0 = Math.min(x0, x - r); y0 = Math.min(y0, y - r); x1 = Math.max(x1, x + r); y1 = Math.max(y1, y + r); }
  for (let y = Math.floor(y0) - 1; y <= Math.ceil(y1) + 1; y++)
    for (let x = Math.floor(x0) - 1; x <= Math.ceil(x1) + 1; x++) {
      const px = x + .5, py = y + .5;
      let best = 1e9, bu = 0, bs = 0;
      for (let s = 0; s < pts.length - 1; s++) {
        const [ax, ay, ar] = pts[s], [bx, by, br] = pts[s + 1];
        const dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy, L = Math.sqrt(L2) || 1;
        let t = L2 ? ((px - ax) * dx + (py - ay) * dy) / L2 : 0; t = clamp(t, 0, 1);
        const cx = ax + dx * t, cy = ay + dy * t, r = ar + (br - ar) * t;
        const ex = px - cx, ey = py - cy, v = Math.hypot(ex, ey) - r;
        if (v < best) { let nx = dy / L, ny = -dx / L; if (nx * .6 + ny * .8 < 0) { nx = -nx; ny = -ny; } best = v; bu = (ex * nx + ey * ny) / Math.max(r, .01); bs = s + t; }
      }
      if (best <= 0) { const c = fn(x, y, bu, bs); if (c) p.set(x, y, c); }
    }
}
function interpRows(tab, y) {
  if (y <= tab[0][0]) return [tab[0][1], tab[0][2]];
  for (let i = 0; i < tab.length - 1; i++) { const [ya, a0, b0] = tab[i], [yb, a1, b1] = tab[i + 1]; if (y <= yb) { const t = (y - ya) / (yb - ya); return [lerp(a0, a1, t), lerp(b0, b1, t)]; } }
  const l = tab[tab.length - 1]; return [l[1], l[2]];
}
/* wavy ribbon (hair locks): pts [[x,y,w]...] top to bottom */
function ribbon(p, pts, o, tone) {
  const ya0 = Math.ceil(pts[0][1]), ya1 = Math.floor(pts[pts.length - 1][1]);
  for (let y = ya0; y <= ya1; y++) {
    let i = 0; while (i < pts.length - 2 && y > pts[i + 1][1]) i++;
    const [xa, ya, wa] = pts[i], [xb, yb, wb] = pts[i + 1], t = clamp((y - ya) / ((yb - ya) || 1), 0, 1);
    const ph = (y - o.y0) / o.lam * Math.PI * 2 + o.ph, amp = o.A * smooth((y - o.y0) / 10);
    const cx = lerp(xa, xb, t) + amp * Math.sin(ph) + (o.sway ? o.sway(y) : 0), w = lerp(wa, wb, t), L = cx - w / 2, R = cx + w / 2;
    for (let x = Math.ceil(L - .5); x <= Math.floor(R - .5); x++) { const c = tone(x, y, (x + .5 - L) / (R - L || 1), ph); if (c) p.set(x, y, c); }
  }
}
/* stack layers; each layer may draw a soft "inner" line where it overlaps lower layers; INK around the whole silhouette */
function compose(layers, w, h, outer) {
  const out = new Pix(w, h);
  for (const L of layers) {
    if (!L || !L.p) continue;
    const p = L.p.d, o = out.d;
    if (L.inner) for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = y * w + x;
      if (p[i] || !o[i]) continue;
      if ((x > 0 && p[i - 1]) || (x < w - 1 && p[i + 1]) || (y > 0 && p[i - w]) || (y < h - 1 && p[i + w])) o[i] = L.inner;
    }
    for (let i = 0; i < p.length; i++) if (p[i]) o[i] = p[i];
  }
  if (outer) out.outline(outer);
  return out;
}
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const bayer = (x, y) => (BAYER[(y & 3) * 4 + (x & 3)] + .5) / 16;

/* ======================================================================
   Palette: hue-shifted ramps, light → dark
   ====================================================================== */
const CREAM = ['#fffaf3', '#fbf0e4', '#f5e4d4', '#eacfbe', '#d6b3a5', '#b48d86'];
const PINK  = ['#ffe4ea', '#fac7d3', '#f2a5ba', '#e3829f', '#c66282', '#9b4664'];
const MAUVE = ['#efcfd3', '#e2b8c1', '#cf9fad', '#b48495', '#8b6378'];
const WOOD  = ['#f0cba8', '#e2b28f', '#d09d7a', '#b58163', '#93614c', '#6b4537'];
const LAV   = ['#f3ecfc', '#ddcff4', '#bfaae7', '#9a84cd', '#71609e', '#4f4275'];
const MINT  = ['#e7f7ee', '#c2ead6', '#95d3b5', '#62ae8f', '#3f806a'];
const GREEN = ['#b9e394', '#86c870', '#58a65c', '#3b8150', '#285c40'];
const GOLD  = ['#fff6cc', '#f7da84', '#e4b656', '#b98939', '#8a6230'];
const BLACK = ['#6a5869', '#4a3b4a', '#332834', '#211921'];
const SILVER = ['#ffffff', '#e9edf6', '#c6cde0', '#949cb8', '#666d8c'];
const NAVY  = ['#aebff0', '#6a82cc', '#4358a2', '#2e3e7c', '#202b5b', '#141a3e'];
const STRAW = ['#fcecbe', '#f2d692', '#ddb46c', '#ba8c4c', '#866232'];
const SKIN  = ['#fcdcc2', '#f1c09c', '#dc9f7b', '#be7d5e', '#8e5243'];
const HAIR  = ['#b27a58', '#7f4b36', '#5c3427', '#3e221b', '#26140f'];
const DSKIN = ['#b57a55', '#8d5638', '#6e3f29', '#53301f', '#3a2016'];
const PLAT  = ['#fffcf0', '#f6edd2', '#e3d3ab', '#c2ab80', '#8f7a56'];
const LIP   = ['#ffd6df', '#f390a8', '#d9607f', '#a9405e'];
const EYE   = { w: '#fff7f2', i: '#9a6040', I: '#4a2a1c', j: '#d49d66', h: '#ffffff' };
const RAMPS = [CREAM, PINK, MAUVE, WOOD, LAV, MINT, GREEN, GOLD, SKIN, HAIR, STRAW, NAVY, SILVER, DSKIN, PLAT, BLACK];
const DARKER = {}, LIGHTER = {};
RAMPS.forEach(r => r.forEach((c, i) => { if (i < r.length - 1 && !DARKER[c]) DARKER[c] = r[i + 1]; if (i > 0 && !LIGHTER[c]) LIGHTER[c] = r[i - 1]; }));
const darker = c => DARKER[c] || shade(c, -.14);
const lighter = c => LIGHTER[c] || mix(c, '#fff6e8', .22);

/* ======================================================================
   THE DOLL: one shared body + pose; every garment is its own layer
   ====================================================================== */
const DW = 76, DH = 134, HX = 28, HY = 14;
const HEAD_ROWS = [[6, 14], [4, 16], [3, 17], [2, 18], [1, 19], [1, 19], [0, 20], [0, 20], [0, 20], [0, 20], [0, 20], [0, 20], [0, 20], [0, 20], [1, 19], [1, 19], [2, 18], [2, 18], [3, 17], [4, 16], [5, 15], [6, 14], [8, 12]];
/* contrapposto: weight on her left leg (screen right), that hip high and out, hand resting on it */
const TORSO = [[41, 33.6, 42.4], [42, 30, 46], [43, 27.4, 48.2], [44, 26.6, 49.2], [45, 26.4, 49.6], [46, 27.2, 49.4], [48, 29.2, 47.8], [50, 30.2, 46.8], [52, 31.2, 46.2], [54, 32, 45.8], [56, 32.6, 45.8], [58, 32.4, 46.8], [60, 31.8, 48.2], [62, 31.2, 49.4], [64, 30.8, 49.8], [66, 30.6, 49.4], [68, 31, 48.6], [70, 32.2, 47.4]];
const LEG_R = [[43.2, 66, 4.4], [42.4, 76, 4.2], [41.2, 88, 3.1], [40.4, 96, 2.5], [40.3, 103, 2.8], [39.6, 112, 2.2], [39, 121, 1.4], [39, 123.5, 1.4]];
const LEG_L = [[34.6, 67, 4.4], [34.8, 76, 4.2], [35.8, 88, 3.1], [36.4, 95, 2.5], [35.4, 102, 2.7], [33.6, 111, 2.1], [31.6, 120, 1.4], [31.2, 122.5, 1.4]];
const FOOT_R = [[39.1, 123.5, 1.5], [39.6, 127.4, 2.0]];
const FOOT_L = [[31.2, 122.5, 1.5], [30.2, 126.6, 2.0]];
const ARM_L = [[29.2, 45, 3.2], [27, 52, 2.6], [25, 58.5, 2.2], [23.8, 64, 1.95], [23, 69.5, 1.55]];
const HAND_L = [[23, 69.5, 1.6], [22.6, 73, 2.0], [22.9, 75.6, 1.5]];
const ARM_R = [[46.8, 45.5, 3.2], [50.8, 51, 2.6], [55, 56.4, 2.2], [53.4, 59.4, 2.0], [51.2, 61.8, 1.6]];
const HAND_R = [[51.2, 61.8, 1.7], [50, 63.6, 2.0], [49.4, 65.2, 1.5]];
const skinT = (x, y, u) => u < -.42 ? SKIN[0] : u > .38 ? SKIN[2] : SKIN[1];

function drawHead(p, blink) {
  HEAD_ROWS.forEach(([a, b], y) => {
    for (let x = a; x <= b; x++) {
      let c = SKIN[1];
      if (y >= 5 && x >= b - (y >= 14 ? 1 : 0)) c = SKIN[2];
      if (y >= 4 && y <= 6 && x >= 7 && x <= 11) c = SKIN[0];
      if (y === 22) c = x >= 10 ? SKIN[2] : SKIN[1];
      p.set(HX + x, HY + y, c);
    }
  });
  const F = { s: SKIN[1], a: SKIN[0], d: SKIN[2], D: SKIN[3], k: INK, w: EYE.w, h: EYE.h, I: EYE.I, i: EYE.i, j: EYE.j, b: HAIR[2], B: HAIR[1], p: '#f08a92', m: LIP[1], M: LIP[2], X: LIP[3], g: LIP[0], q: '#f4d8c8' };
  const put = (x, y, ch) => p.set(HX + x, HY + y, F[ch]);
  const both = (x, y, ch) => { put(x, y, ch); put(20 - x, y, ch); };
  // soft arched brows
  both(3, 7, 'B'); both(4, 6, 'b'); both(5, 6, 'b'); both(6, 7, 'B');
  if (!blink) {
    // arched glam lash line with a winged flick; tall bright iris with two catch-lights
    both(1, 9, 'k'); both(2, 9, 'k'); for (let x = 3; x <= 6; x++) both(x, 9, 'k');
    both(2, 10, 'k'); both(7, 10, 'k');
    both(3, 10, 'w'); both(3, 11, 'w'); both(3, 12, 'w'); both(7, 11, 'w'); both(7, 12, 'w');
    both(3, 13, 'q'); both(7, 13, 'q');
    for (const ex of [4, 14]) {
      put(ex, 10, 'h'); put(ex + 1, 10, 'I'); put(ex + 2, 10, 'I');
      put(ex, 11, 'I'); put(ex + 1, 11, 'k'); put(ex + 2, 11, 'i');
      put(ex, 12, 'i'); put(ex + 1, 12, 'i'); put(ex + 2, 12, 'j');
      put(ex, 13, 'j'); put(ex + 1, 13, 'j'); put(ex + 2, 13, 'h');
      put(ex, 14, 'q'); put(ex + 1, 14, 'q'); put(ex + 2, 14, 'q');
    }
  } else {
    for (let x = 2; x <= 7; x++) { both(x, 9, 's'); both(x, 10, 's'); both(x, 11, 's'); both(x, 12, 's'); both(x, 13, 's'); }
    both(1, 10, 'k'); both(2, 11, 'k'); for (let x = 3; x <= 6; x++) both(x, 12, 'k'); both(7, 11, 'k'); both(4, 10, 'd'); both(5, 10, 'd');
  }
  both(2, 15, 'p'); both(3, 15, 'p');
  put(11, 15, 'd'); put(10, 16, 'd');
  // glossy pink lips
  put(9, 18, 'M'); put(10, 18, 'M'); put(11, 18, 'M');
  put(8, 19, 'X'); put(9, 19, 'm'); put(10, 19, 'm'); put(11, 19, 'm'); put(12, 19, 'X');
  put(9, 20, 'm'); put(10, 20, 'g'); put(11, 20, 'm');
}
function drawCore(blink) {
  const p = new Pix(DW, DH);
  chain(p, LEG_L, skinT); chain(p, FOOT_L, skinT); chain(p, LEG_R, skinT); chain(p, FOOT_R, skinT);
  for (let y = 41; y <= 70; y++) {
    const [a0, b0] = interpRows(TORSO, y), a = Math.round(a0), b = Math.round(b0);
    for (let x = a; x <= b; x++) { const v = (x - a) / Math.max(1, b - a); p.set(x, y, v < .12 ? SKIN[0] : v > .85 ? SKIN[2] : SKIN[1]); }
  }
  for (let y = 34; y <= 42; y++) for (let x = 35; x <= 41; x++) p.set(x, y, y <= 37 ? SKIN[3] : y === 38 ? SKIN[2] : x >= 40 ? SKIN[2] : SKIN[1]);
  drawHead(p, blink);
  return p;
}
function drawArms() {
  const p = new Pix(DW, DH);
  chain(p, ARM_L, skinT); chain(p, HAND_L, skinT); chain(p, ARM_R, skinT); chain(p, HAND_R, skinT);
  p.set(23, 75, SKIN[2]); p.set(22, 74, SKIN[2]);            // curled fingers
  p.set(49, 65, SKIN[2]); p.set(50, 65, SKIN[2]); p.set(48, 64, SKIN[2]); // fingers over the hip
  p.set(54, 56, SKIN[0]);                                     // elbow highlight
  return p;
}

/* ---- hair: crown + long wavy locks, 3 tones + sheen ---- */
const FACEWIN = { 18: [36, 40], 19: [34, 42], 20: [32, 44], 21: [31, 45], 22: [30, 46], 23: [30, 46], 24: [29, 47], 25: [29, 47], 26: [29, 47], 27: [29, 47], 28: [29, 47], 29: [29, 47] };
function hairTone(base) {
  return (x, y, v, ph) => {
    const s = Math.sin(ph + .9 - v * 1.6);
    let k = base;
    if (v < .3) k -= 1; else if (v > .74) k += 1;
    if (s > .6) k -= 1; else if (s < -.65) k += 1;
    k = clamp(k, base === 2 ? 0 : 1, 3);
    if (k === 0 && (s < .85 || v > .6)) k = 1;
    return HAIR[k];
  };
}
function drawHair(sway) {
  const back = new Pix(DW, DH), front = new Pix(DW, DH);
  const sw = y => sway * smooth((y - 44) / 18);
  // back layer: volume that falls behind the shoulders and arms
  back.ell(38, 24.4, 13.4, 13.2, HAIR[3]);
  back.rect(32, 30, 14, 30, HAIR[3]);
  ribbon(back, [[44, 26, 7], [45.5, 36, 7.4], [46.6, 46, 7.4], [47, 56, 6.4], [47, 63, 3.8], [47, 67, .8]], { A: 1, lam: 11, ph: 2.6, y0: 32, sway: sw }, hairTone(3));
  ribbon(back, [[33, 34, 5], [31, 46, 5.4], [30.4, 58, 5], [30.6, 66, 3], [30.8, 70, .8]], { A: 1, lam: 11, ph: 2.9, y0: 34, sway: sw }, hairTone(3));
  ribbon(back, [[31, 22, 7], [28, 32, 8], [25.6, 42, 8.6], [24.4, 52, 8.4], [24, 60, 6.6], [24.4, 66, 3.8], [24.8, 71, .8]], { A: 1.1, lam: 11, ph: 1.2, y0: 30, sway: sw }, hairTone(3));
  ribbon(back, [[48.6, 17, 4.4], [49.2, 23, 5.2], [49.6, 29, 5.8], [50.4, 37, 6.4], [51.2, 45, 6.8], [51.8, 53, 6.6], [51.8, 60, 5.2], [51.4, 65, 3.2], [51.2, 69, .8]], { A: 1.1, lam: 11, ph: 2, y0: 30, sway: sw }, hairTone(2));
  // crown with a center part and a sheen ring
  const cx = 38, cy = 24.6, rx = 12.9, ry = 12.6;
  for (let y = 10; y <= 29; y++) for (let x = 24; x <= 52; x++) {
    const dx = (x + .5 - cx) / rx, dy = (y + .5 - cy) / ry, r = Math.hypot(dx, dy);

  bctx.drawImage(HL[Math.floor(t * 2.5) % 2], HILITE.ox - 2, HILITE.oy - 2);
  // rival (her own slower breathing)
  bctx.drawImage(RIVAL_CV[Math.floor((t + .65) / 1.6) % 2], RIVAL_X, RIVAL_Y);
  // doll
  const f = dollFrame(t);
  let dollCv;
  if (state.trans) {
    const k = (t - state.trans.t0) / .55;
    if (k >= 1) state.trans = null;
    else {
      const a = dollPix(state.trans.from, f.blink, f.sway, f.bob), b = dollPix(state.trans.to, f.blink, f.sway, f.bob), m = new Pix(DW, DH);
      for (let y = 0; y < DH; y++) for (let x = 0; x < DW; x++) m.d[y * DW + x] = bayer(x, y) < k ? b.d[y * DW + x] : a.d[y * DW + x];
      dollCv = m.canvas();
    }
  }
  if (!dollCv) dollCv = cv(dollPix(state.outfit, f.blink, f.sway, f.bob));
  bctx.drawImage(dollCv, DOLL_X, DOLL_Y);
  // sparkles
  for (const [x, y, per, ph, col] of SPARKS) { const q = ((t + ph) % per) / per; if (q < .22) sparkle(bctx, x, y, [0, 1, 2, 1, 0][Math.floor(q / .22 * 5)], col); }
  if (state.outfit === 'b' && !state.trans) {
    [[38, 7, 1.9, 0], [44, 12, 2.7, 1.1], [22, 96, 2.6, .8], [55, 108, 3.1, 1.7], [30, 74, 2.3, 1.2], [47, 122, 2.8, 2.2], [40, 86, 3.4, .3]].forEach(([x, y, per, ph]) => { const q = ((t + ph) % per) / per; if (q < .25) sparkle(bctx, DOLL_X + x, DOLL_Y + y, [0, 1, 2, 1, 0][Math.floor(q / .25 * 5)], '#dfe8ff'); });
  } else if (!state.trans) {
    [[38, 45, 2.7, .4], [50, 9, 3.3, 1.6], [20, 18, 3.9, 2.6]].forEach(([x, y, per, ph]) => { const q = ((t + ph) % per) / per; if (q < .22) sparkle(bctx, DOLL_X + x, DOLL_Y + y, [0, 1, 2, 1, 0][Math.floor(q / .22 * 5)], GOLD[0]); });
  }
  if (state.trans) {
    const k = (t - state.trans.t0) / .55, rr = rng(state.trans.seed);
    for (let i = 0; i < 16; i++) { const a = rr() * Math.PI * 2, d = 18 + rr() * 30 + k * 10, x = DOLL_X + 38 + Math.cos(a) * d * .7, y = DOLL_Y + 70 + Math.sin(a) * d * 1.2; sparkle(bctx, x, y, (i + Math.floor(k * 6)) % 3, i % 2 ? PINK[0] : GOLD[0]); }
  }
  // UI
  bctx.drawImage(UI.bannerCv, 0, 0);
  bctx.drawImage(timerCv(564 - Math.floor(t)), 130, 14);
  bctx.drawImage(UI.you, Math.round(DOLL_CX - UI.you.width / 2), 47 - UI.you.height + 3);
  bctx.drawImage(UI.aria, Math.round(RIVAL_X + 21 - UI.aria.width / 2), RIVAL_Y + 5 - UI.aria.height + 3);
  const bb = Math.floor(t / .8) % 2;
  bctx.drawImage(UI.bubble, HILITE.cx - UI.bubbleTail, 3 - bb);
  const R = UI.btnRect, bs = state.down ? 'down' : state.hover ? 'hover' : 'up';
  bctx.drawImage(UI.btnCv[bs], R.x - 1, R.y - 1);
}
let T0 = null;
function loop(now) {
  if (T0 === null) T0 = now;
  render((now - T0) / 1000);
  present();
  requestAnimationFrame(loop);
}
function toggle() {
  const t = (performance.now() - (T0 || performance.now())) / 1000;
  const from = state.outfit, to = from === 'a' ? 'b' : 'a';
  state.outfit = to; state.trans = CALM ? null : { from, to, t0: t, seed: (Math.random() * 1e9) | 0 };
}
btnEl.addEventListener('click', toggle);
btnEl.addEventListener('pointerenter', () => { state.hover = true; });
btnEl.addEventListener('pointerleave', () => { state.hover = false; state.down = false; });
btnEl.addEventListener('pointerdown', () => { state.down = true; });
window.addEventListener('pointerup', () => { state.down = false; });
window.addEventListener('resize', layout);

function init() {
  ROOM_CV = drawRoom().canvas();
  RIVAL_CV = [buildRival(0).canvas(), buildRival(1).canvas()];
  HL = [hiliteRing(0), hiliteRing(1)];
  buildUI();
  requestAnimationFrame(loop);
}
const fontsReady = document.fonts ? Promise.race([
  Promise.all([document.fonts.load(FONTS.tiny.f), document.fonts.load(FONTS.big.f)]),
  new Promise(r => setTimeout(r, 2500)),
]).catch(() => {}) : Promise.resolve();
layout();
fontsReady.then(() => { init(); if (document.fonts) document.fonts.ready.then(() => { for (const k in TEXT_CACHE) delete TEXT_CACHE[k]; buildUI(); }); });
})();
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spell to Impress 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#2a1724;}
  body{background:radial-gradient(120% 95% at 50% 42%,#4d2b42 0%,#2c1826 58%,#1c0e18 100%);font-family:'Fredoka',ui-rounded,system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  #stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;background:#efe1da;box-shadow:0 12px 70px rgba(0,0,0,.5);}
  #gl{position:absolute;left:0;top:0;width:1280px;height:720px;display:block;outline:none;touch-action:none;cursor:grab;}
  #gl:active{cursor:grabbing;}
  #ui{position:absolute;inset:0;pointer-events:none;}
  #vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 110% at 44% 46%,rgba(80,30,55,0) 52%,rgba(80,30,55,.20) 100%);}

  /* theme banner */
  #banner{position:absolute;left:50%;top:8px;width:500px;height:70px;transform:translateX(-50%);}
  #banner svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 5px 9px rgba(140,30,85,.28));}
  #banner .btext{position:absolute;left:0;right:0;top:9px;text-align:center;white-space:nowrap;color:#fff;font-weight:700;font-size:31px;letter-spacing:.4px;line-height:44px;
    text-shadow:0 2.5px 0 #c4387c,0 4px 0 #a92c68,0 6px 10px rgba(120,20,70,.35);}
  #banner .t1{font-weight:600;font-size:27px;opacity:.97;margin-right:4px;}
  #timer{position:absolute;left:50%;top:72px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:2px 14px 2px 9px;border-radius:999px;
    background:linear-gradient(#fff,#fff3f8);color:#de3f8b;font-weight:600;font-size:21px;line-height:28px;font-variant-numeric:tabular-nums;
    box-shadow:0 3px 0 #f6c3db,0 6px 14px rgba(150,40,95,.22);}
  #timer svg{width:19px;height:19px;}

  /* nameplates */
  .plate{position:absolute;left:0;top:0;transform:translate(-50%,-100%);text-align:center;white-space:nowrap;will-change:transform;transition:opacity .25s;}
  .pname{font-weight:700;font-size:23px;line-height:1;color:#fff;letter-spacing:.3px;
    text-shadow:0 0 1.5px #7d2a5a,0 0 1.5px #7d2a5a,0 2px 0 #a8356f,0 3px 8px rgba(110,25,70,.45);}
  .ptitle{display:inline-flex;align-items:center;gap:4px;margin-top:4px;padding:2px 9px 2px 7px;border-radius:999px;font-weight:600;font-size:12.5px;line-height:17px;color:#fff;
    background:linear-gradient(#ff95c6,#ec5b9c);box-shadow:0 2px 0 #c43f7f,0 4px 9px rgba(140,35,90,.3);}
  .ptitle svg{width:11px;height:11px;}
  .plate.rival{font-size:0;}
  .plate.rival .pname{font-size:17px;}
  .plate.rival .ptitle{font-size:10.5px;line-height:14px;padding:1px 7px 1px 6px;background:linear-gradient(#c9adff,#9a78e6);box-shadow:0 2px 0 #7656c2,0 3px 7px rgba(80,40,140,.3);}

  /* spell prompt */
  #spell{position:absolute;left:0;top:0;transform:translate(-50%,-100%);will-change:transform;transition:opacity .25s;}
  #spell .bub{position:relative;display:flex;align-items:center;gap:8px;padding:6px 15px 6px 6px;border-radius:17px;background:#fff;color:#e2428c;
    font-weight:700;font-size:23px;line-height:30px;white-space:nowrap;filter:drop-shadow(0 5px 9px rgba(120,30,80,.3));animation:bob 2.4s ease-in-out infinite;}
  #spell .bub:after{content:"";position:absolute;left:50%;bottom:-10px;margin-left:-10px;border-left:10px solid transparent;border-right:10px solid transparent;border-top:11px solid #fff;}
  #spell .spk{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(#ff95c6,#ec5b9c);box-shadow:inset 0 -2px 0 rgba(160,30,90,.35);}
  #spell .spk svg{width:19px;height:19px;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

  /* lock badges */
  .lock{position:absolute;left:0;top:0;width:21px;height:21px;margin:-12px 0 0 -12px;border-radius:50%;display:grid;place-items:center;border:2px solid #fff;
    background:linear-gradient(#b597ec,#8063cf);box-shadow:0 2px 5px rgba(60,25,90,.4);will-change:transform;transition:opacity .25s;}
  .lock svg{width:12px;height:12px;}

  /* outfit button */
  #swap{position:absolute;right:26px;bottom:24px;pointer-events:auto;display:flex;align-items:center;gap:9px;border:0;cursor:pointer;font-family:inherit;font-weight:600;font-size:19px;
    color:#fff;padding:11px 22px 12px 15px;border-radius:999px;overflow:hidden;
    background:linear-gradient(180deg,#ff9fcb 0%,#f5679f 52%,#e2488b 100%);
    box-shadow:0 5px 0 #b5326d,0 10px 22px rgba(130,25,75,.38),inset 0 2px 0 rgba(255,255,255,.55);text-shadow:0 1.5px 0 rgba(150,25,85,.55);transition:transform .15s,box-shadow .15s;}
  #swap:before{content:"";position:absolute;left:10px;right:10px;top:3px;height:42%;border-radius:999px;background:linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,0));pointer-events:none;}
  #swap:hover{transform:translateY(-2px);box-shadow:0 7px 0 #b5326d,0 13px 24px rgba(130,25,75,.4),inset 0 2px 0 rgba(255,255,255,.55);}
  #swap:active{transform:translateY(4px);box-shadow:0 1px 0 #b5326d,0 5px 12px rgba(130,25,75,.35),inset 0 2px 0 rgba(255,255,255,.55);}
  #swap svg{width:26px;height:26px;position:relative;}
  #swap span{position:relative;}

  /* drag hint */
  #hint{position:absolute;left:20px;bottom:24px;display:flex;align-items:center;gap:6px;padding:5px 12px 5px 8px;border-radius:999px;background:rgba(80,35,62,.30);
    color:#fff;font-size:13px;font-weight:500;letter-spacing:.2px;opacity:.85;transition:opacity 1s;}
  #hint svg{width:17px;height:17px;}
  #hint.gone{opacity:0;}

  /* outfit change flash + sparkles */
  #flash{position:absolute;inset:0;opacity:0;background:radial-gradient(circle at var(--fx,40%) var(--fy,52%),rgba(255,255,255,.95) 0%,rgba(255,220,238,.6) 16%,rgba(255,220,238,0) 42%);}
  #flash.on{animation:flash .75s ease-out;}
  @keyframes flash{0%{opacity:0}22%{opacity:1}100%{opacity:0}}
  .spark{position:absolute;left:0;top:0;width:26px;height:26px;margin:-13px 0 0 -13px;opacity:0;animation:spark .9s ease-out forwards;}
  @keyframes spark{0%{opacity:0;transform:translate(0,0) scale(.2) rotate(0deg)}25%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(var(--s)) rotate(90deg)}}
</style>
</head>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ------------------------------------------------------------------ *
 *  Stage, renderer, camera, lights
 * ------------------------------------------------------------------ */
const W = 1280, H = 720;
const $ = id => document.getElementById(id);
const stage = $('stage'), canvas = $('gl');
const QS = new URLSearchParams(location.search);
let outfit = (QS.get('outfit') || 'a').toLowerCase() === 'b' ? 'B' : 'A';

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setClearColor('#efe1da');

function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  stage.style.transform = `translate(${(innerWidth - W * s) / 2}px,${(innerHeight - H * s) / 2}px) scale(${s})`;
  renderer.setPixelRatio(Math.min(2, Math.max(0.5, s * (window.devicePixelRatio || 1))));
  renderer.setSize(W, H, false);
}
fit();
addEventListener('resize', fit);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#efe1da');
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.42;

const camera = new THREE.PerspectiveCamera(31, W / H, 0.1, 80);
const VIEW_OFF = { x: 118, y: -20 };           // lens shift: player sits a bit left of centre, low in frame
camera.setViewOffset(W, H, VIEW_OFF.x, VIEW_OFF.y, W, H);
const ORBIT_TARGET = new THREE.Vector3(0, 1.16, 0);
camera.position.set(0.616, 2.018, 5.016);    // far enough back that the ball gown's front hem stays in frame

const controls = new OrbitControls(camera, canvas);
controls.target.copy(ORBIT_TARGET);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.enablePan = false;
controls.rotateSpeed = 0.55;
controls.zoomSpeed = 0.6;
controls.minDistance = 3.7;
controls.maxDistance = 6.3;
controls.minPolarAngle = 1.17;
controls.maxPolarAngle = 1.53;
controls.minAzimuthAngle = -1.05;
controls.maxAzimuthAngle = 1.05;
controls.update();
controls.addEventListener('start', () => $('hint').classList.add('gone'));

// lights: hemisphere fill, warm key (shadows), pink rim, faint lavender fill
const hemi = new THREE.HemisphereLight('#fff3f4', '#c99a80', 0.78);
scene.add(hemi);
const key = new THREE.DirectionalLight('#ffe7d2', 2.45);
key.position.set(-2.8, 5.6, 4.6);
key.target.position.set(0.2, 0.9, -1.4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -6.4, right: 6.4, top: 5.2, bottom: -5.2, near: 0.5, far: 18 });
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.028;
scene.add(key, key.target);
const rim = new THREE.DirectionalLight('#ff86c2', 2.3);
rim.position.set(2.6, 3.4, -4.2);
rim.target.position.set(0, 1.2, 0);
scene.add(rim, rim.target);
const fill = new THREE.DirectionalLight('#e9e2ff', 0.45);
fill.position.set(4.5, 2.2, 3.5);
scene.add(fill);
// soft pool of light on the player so she reads first
const spot = new THREE.SpotLight('#fff0e6', 1.35, 0, 0.36, 0.9, 0);
spot.position.set(0.9, 5.4, 3.4); spot.target.position.set(0, 0.95, 0);
scene.add(spot, spot.target);
scene.fog = new THREE.Fog('#efdcd8', 7.5, 26);

/* ------------------------------------------------------------------ *
 *  Small helpers
 * ------------------------------------------------------------------ */
const TAU = Math.PI * 2;
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);

// recompute normals and weld them across UV seams / poles so shading is seamless
function smoothSeams(geo) {
  geo.computeVertexNormals();
  const P = geo.attributes.position.array, N = geo.attributes.normal.array, cnt = P.length / 3;
  // bucket vertices by a numeric spatial hash, then weld normals of exactly coincident points
  const head = new Int32Array(8192).fill(-1), next = new Int32Array(cnt), mask = 8191, done = new Uint8Array(cnt);
  const key = i => { const x = Math.round(P[i * 3] * 2e4), y = Math.round(P[i * 3 + 1] * 2e4), z = Math.round(P[i * 3 + 2] * 2e4); return ((x * 73856093) ^ (y * 19349663) ^ (z * 83492791)) & mask; };
  for (let i = 0; i < cnt; i++) { const k = key(i); next[i] = head[k]; head[k] = i; }
  const same = (a, b) => Math.abs(P[a * 3] - P[b * 3]) < 5e-5 && Math.abs(P[a * 3 + 1] - P[b * 3 + 1]) < 5e-5 && Math.abs(P[a * 3 + 2] - P[b * 3 + 2]) < 5e-5;
  const grp = [];
  for (let i = 0; i < cnt; i++) {
    if (done[i]) continue;
    grp.length = 0;
    for (let j = head[key(i)]; j !== -1; j = next[j]) if (!done[j] && same(i, j)) grp.push(j);
    if (grp.length < 2) { done[i] = 1; continue; }
    let x = 0, y = 0, z = 0;
    for (const j of grp) { x += N[j * 3]; y += N[j * 3 + 1]; z += N[j * 3 + 2]; done[j] = 1; }
    const l = Math.hypot(x, y, z) || 1;
    for (const j of grp) { N[j * 3] = x / l; N[j * 3 + 1] = y / l; N[j * 3 + 2] = z / l; }
  }
  geo.attributes.normal.needsUpdate = true;
  return geo;
}
const GEO_CACHE = new Map();
const cached = (k, fn) => { let g = GEO_CACHE.get(k); if (!g) GEO_CACHE.set(k, g = fn()); return g; };

// sample a list of keyframes [t, a, b, c...] with Catmull-Rom so profiles stay smooth
function crSample(keys, t) {
  const n = keys.length;
  let i = 0; while (i < n - 2 && keys[i + 1][0] < t) i++;
  const k0 = keys[Math.max(0, i - 1)], k1 = keys[i], k2 = keys[i + 1], k3 = keys[Math.min(n - 1, i + 2)];
  const u = clamp((t - k1[0]) / ((k2[0] - k1[0]) || 1), 0, 1), u2 = u * u, u3 = u2 * u;
  const out = [];
  for (let c = 1; c < k1.length; c++) {
    const p0 = k0[c], p1 = k1[c], p2 = k2[c], p3 = k3[c];
    out.push(0.5 * ((2 * p1) + (-p0 + p2) * u + (2 * p0 - 5 * p1 + 4 * p2 - p3) * u2 + (-p0 + 3 * p1 - 3 * p2 + p3) * u3));
  }
  return out;
}

// LatheGeometry with an elliptical, offset cross-section.  keys: [y, rx, rz, zOffset] (y ascending)
function bodyLathe(keys, { samples = 40, segs = 48, phiStart = Math.PI } = {}) {
  const y0 = keys[0][0], y1 = keys[keys.length - 1][0], prof = [];
  for (let j = 0; j <= samples; j++) {
    const y = lerp(y0, y1, j / samples), [rx, rz, zo] = crSample(keys, y);
    prof.push({ y, rx: Math.max(rx, 1e-4), rz: Math.max(rz, 1e-4), zo });
  }
  const geo = new THREE.LatheGeometry(prof.map(p => new THREE.Vector2(p.rx, p.y)), segs, phiStart);
  const pos = geo.attributes.position, np = prof.length;
  for (let i = 0; i < pos.count; i++) {
    const p = prof[i % np];
    pos.setZ(i, pos.getZ(i) * (p.rz / p.rx) + p.zo);
  }
  return smoothSeams(geo);
}

// a rounded capsule-style limb along -y: keys [d, r] with d = distance down the limb
function limbLathe(len, keys, { segs = 28, samples = 34 } = {}) {
  const r0 = keys[0][1], r1 = keys[keys.length - 1][1], pts = [];
  for (let k = 0; k <= 8; k++) { const a = -Math.PI / 2 + (k / 8) * (Math.PI / 2); pts.push(new THREE.Vector2(Math.cos(a) * r1, -len + Math.sin(a) * r1)); }
  for (let j = 1; j < samples; j++) { const d = len * (1 - j / samples); pts.push(new THREE.Vector2(crSample(keys, d)[0], -d)); }
  for (let k = 0; k <= 8; k++) { const a = (k / 8) * (Math.PI / 2); pts.push(new THREE.Vector2(Math.cos(a) * r0, Math.sin(a) * r0)); }
  pts[0].x = 1e-4; pts[pts.length - 1].x = 1e-4;
  return smoothSeams(new THREE.LatheGeometry(pts, segs));
}

// grid surface from a parametric function fn(u, v, target)
function gridGeo(nu, nv, fn, flip = false) {
  const pos = new Float32Array((nu + 1) * (nv + 1) * 3), uv = new Float32Array((nu + 1) * (nv + 1) * 2), idx = [];
  const p = new THREE.Vector3(); let k = 0;
  for (let j = 0; j <= nv; j++) for (let i = 0; i <= nu; i++) {
    fn(i / nu, j / nv, p); pos[k * 3] = p.x; pos[k * 3 + 1] = p.y; pos[k * 3 + 2] = p.z;

    const sc = makeSconce(); sc.position.set(x, 2.15, -4.22); room.add(sc);
  }
  const place = (obj, spot, row, dx, rotY = 0) => { obj.position.set(spot.cx + dx, spot.rows[row], spot.z + 0.04); obj.rotation.y = rotY; room.add(obj); return obj; };
    // S[0] far left
  place(makeBustItem('#ffffff', 'blouse'), S[0], 1, -0.36, 0.2); place(makeBustItem('#f6a9c4', 'cami'), S[0], 1, 0, 0); place(makeBustItem('#c9b3f2', 'blouse'), S[0], 1, 0.36, -0.2);
  place(makeHatItem('#f7c0d4', 'sun'), S[0], 2, -0.25, 0.4); place(makeSkirtItem('#fff2d9'), S[0], 2, 0.27);
  place(makeShoeRow(['#f6a9c4', '#ffffff', '#c9b3f2', '#a8e2cc']), S[0], 0, -0.4, 0);
  // S[1] nearest the player on screen: the highlighted "Spell it!" item lives here
  out.locks.push(place(makeBustItem('#f6a0c0', 'cami'), S[1], 1, -0.38, 0.3));
  const target = place(makeBustItem('#a8e2cc', 'blouse'), S[1], 1, 0.0, 0.08);
  place(makeBustItem('#ffffff', 'blouse'), S[1], 1, 0.38, -0.28);
  place(makeHatItem('#cbb6f0', 'sun'), S[1], 2, -0.27, 0.35); place(makeHatItem('#ffffff', 'beret'), S[1], 2, 0.28, -0.3);
  place(makeShoeRow(['#c9b3f2', '#ffffff', '#f6a9c4', '#fff2d9']), S[1], 0, -0.4, 0);
  // S[2] behind the player
  place(makeSkirtItem('#f6a9c4'), S[2], 1, -0.3); place(makeSkirtItem('#ffffff'), S[2], 1, 0.3);
  place(makeHatItem('#fff2d9', 'sun'), S[2], 2, 0, 0);
  place(makeShoeRow(['#f6a9c4', '#fff2d9', '#ffffff', '#c9b3f2']), S[2], 0, -0.4, 0);
  // S[3]
  place(makeBustItem('#ffd7e6', 'cami'), S[3], 1, -0.36, 0.2); place(makeBustItem('#c9b3f2', 'blouse'), S[3], 1, 0, 0);
  out.locks.push(place(makeSkirtItem('#a8e0c9'), S[3], 1, 0.36));
  out.locks.push(place(makeHatItem('#ffffff', 'sun'), S[3], 2, -0.26, 0.3)); place(makeSkirtItem('#c9b3f2'), S[3], 2, 0.28);
  place(makeShoeRow(['#ffffff', '#c9b3f2', '#f6a9c4', '#a8e2cc']), S[3], 0, -0.4, 0);
  // S[4], S[5]
  place(makeBustItem('#fff2d9', 'blouse'), S[4], 1, -0.36, 0.2); place(makeBustItem('#f6a9c4', 'cami'), S[4], 1, 0, 0); place(makeBustItem('#ffffff', 'blouse'), S[4], 1, 0.36, -0.2);
  place(makeHatItem('#f7c0d4', 'beret'), S[4], 2, -0.25, 0); place(makeHatItem('#ffffff', 'sun'), S[4], 2, 0.27, 0);
  place(makeShoeRow(['#f6a9c4', '#ffffff', '#c9b3f2', '#fff2d9']), S[4], 0, -0.4, 0);
  place(makeBustItem('#c9b3f2', 'cami'), S[5], 1, -0.3, 0); place(makeSkirtItem('#ffffff'), S[5], 1, 0.3);
  // freestanding etagere the rival is browsing
  const unit = makeEtagere(); unit.position.set(3.2, 0, -3.42); unit.rotation.y = -Math.PI / 2; room.add(unit);
  const palm = makePalm(); palm.position.set(-2.62, 0, -1.25); palm.scale.setScalar(1.22); room.add(palm);
  out.occ = [palm, unit];
  // highlight on the target item: inverted-hull outline + glow
  const hullMat = new THREE.MeshBasicMaterial({ color: '#ff5fa8', side: THREE.BackSide, transparent: true, opacity: 0.9, depthWrite: false, fog: false });
  hullMat.onBeforeCompile = sh => { sh.vertexShader = sh.vertexShader.replace('#include <begin_vertex>', 'vec3 transformed = position + normal * 0.016;'); };
  const hullSrc = []; target.traverse(m => { if (m.isMesh && m.geometry.attributes.normal) hullSrc.push(m); });
  for (const m of hullSrc) { const h = new THREE.Mesh(m.geometry, hullMat); h.position.copy(m.position); h.rotation.copy(m.rotation); h.scale.copy(m.scale); m.parent.add(h); }
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX.glow, color: '#ff9fd0', transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending, depthWrite: false }));
  glow.scale.set(0.95, 0.95, 1); glow.position.set(0, 0.28, -0.05); target.add(glow);
  out.target = target; out.hullMat = hullMat; out.glow = glow;
  out.rivalSpot = V3(2.26, 0, -3.3);
  // soft contact shadows to seat the dolls on the floor
  const blob = canvasTex(128, 128, (g, w) => { const rg = g.createRadialGradient(64, 64, 0, 64, 64, 64); rg.addColorStop(0, 'rgba(70,25,40,.55)'); rg.addColorStop(.5, 'rgba(70,25,40,.22)'); rg.addColorStop(1, 'rgba(70,25,40,0)'); g.fillStyle = rg; g.fillRect(0, 0, w, w); });
  out.blob = (x, z, sx, sz) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: blob, transparent: true, depthWrite: false })); m.rotation.x = -Math.PI / 2; m.position.set(x, 0.024, z); m.scale.set(sx, sz, 1); m.renderOrder = 1; room.add(m); return m; };
  return { room, ...out };
}

/* ------------------------------------------------------------------ *
 *  Assemble the scene
 * ------------------------------------------------------------------ */
const R = buildRoom();
scene.add(R.room);

const PLAYER = { skin: '#efb592', blush: '#ff7d9b', shadow: '#d987a6', crease: '#9b5a52', lash: '#1b0c09', brow: '#4b2b1d',
  iris: ['#8e5d35', '#57321a', '#2c170b', '#b8834f'], lip: ['#d24f78', '#f287a4'], lipLine: '#9e2f52', nose: '#b4604f' };
const RIVAL = { skin: '#7b4631', blush: '#d9637f', shadow: '#a0699a', crease: '#3a1d14', lash: '#100605', brow: '#f2e6d4',
  iris: ['#8a5a34', '#4d2c15', '#26140a', '#b07a45'], lip: ['#b8496c', '#dd7a96'], lipLine: '#7d2846', nose: '#3e1d12' };

const player = buildDoll(PLAYER);
player.bones.headC.add(buildLongHair(player, { base: '#2a1a13', mid: '#47301f', hi: '#9c7a5c', seed: 3 }));
poseDoll(player, {
  hipShift: 0.03, hipTilt: 0.075, chest: [0.02, -0.07, -0.115], neck: [0.06, 0.07, 0.04], head: [-0.04, 0.15, 0.075],
  armL: [[0.26, 0, 0.8], [0, 0, -1.62], [0, 0, 0.72]],
  armR: [[-0.1, 0.1, -0.2], [-0.5, 0, 0.1], [-0.2, 0.35, 0.12]],
  stand: 'L', standThigh: [0.0, 0, -0.14], standYaw: 0.3, freeThigh: [-0.3, 0, -0.03], freeYaw: -0.12, freePitch: 0.42
});
player.root.rotation.y = -0.2;
scene.add(player.root);

const rival = buildDoll(RIVAL);
rival.bones.headC.add(buildBunHair(rival, { base: '#d9ccb6', mid: '#efe5d3', hi: '#fffaf0', seed: 8 }));
poseDoll(rival, {
  hipShift: -0.028, hipTilt: -0.065, chest: [0.0, 0.16, 0.09], neck: [0.06, 0.16, -0.03], head: [0.1, 0.2, -0.07],
  armL: [[-0.95, -0.15, 0.22], [-0.75, 0, -0.08], [0, 0, -0.15]],
  armR: [[0.04, 0, -0.13], [-0.28, 0, 0.05], [0, 0.2, 0]],
  stand: 'R', standThigh: [0, 0, 0.13], standYaw: -0.3, freeThigh: [-0.26, 0, 0.04], freeYaw: 0.12, freePitch: 0.4
});
rival.root.position.copy(R.rivalSpot); rival.root.rotation.y = Math.PI / 2 - 0.78; rival.root.scale.setScalar(0.97);
scene.add(rival.root);
R.blob(0.02, 0.02, 0.62, 0.5); R.blob(R.rivalSpot.x, R.rivalSpot.z, 0.55, 0.45);

// wardrobes: every piece is a separate item on the shared body
const OUTFITS = {
  A: [makeSundress({ print: TEX.floral, inner: '#d9718f', sash: '#f0679b', skirt: { yHem: -0.53, rHem: [0.4, 0.35] } }), makeStrawHat(), makePearls(), makeShoes({})],
  B: [makeGown(), makeTiara(), makeGloves(), makeShoes({ color: '#e9edf6', sole: '#c9d0e2', strap: false, point: 1, heel: 'stiletto', metal: true })]
};
const lavender = new THREE.MeshStandardMaterial({ color: '#c6a8f0', roughness: 0.62 });
const rivalDress = makeSundress({ outerMat: lavender, inner: '#9a7bc8', sash: '#f49ac1', trim: '#ffffff', sleeveMat: cloth('#ffffff', 0.7),
  sleeveBow: true, chestBow: true, skirtBows: true, skirt: { yHem: -0.47, rHem: [0.37, 0.33], folds: 13 }, frill: { y: -0.47, r: [0.37, 0.33], drop: 0.045 } });
rival.equip(rivalDress);
rival.equip(makeShoes({ color: '#ffffff', sole: '#f2b8c9' }));
const rivalBows = new THREE.MeshStandardMaterial({ color: '#f49ac1', roughness: 0.36 });
for (const s of [-1, 1]) { const b = makeBow(rivalBows, 0.7); b.position.set(s * 0.088, 0.2, 0.04); b.rotation.set(-0.3, s * 0.4, 0); rival.bones.headC.add(b); }

let shadowDirty = true;
const occluders = [];
function setOutfit(o, animate) {
  for (const it of [...player.worn]) player.unequip(it);
  for (const it of OUTFITS[o]) {
    player.equip(it);
    if (animate) for (const p of it.parts) { p.obj.userData.s0 = p.obj.userData.s0 || p.obj.scale.clone(); p.obj.userData.pop = 0; popping.add(p.obj); }
  }
  outfit = o; shadowDirty = true;
  if (occluders.length) { occluders.length = 0; for (const r of [player.root, rival.root, ...R.occ]) r.traverse(m => { if (m.isMesh) occluders.push(m); }); }
}
const popping = new Set();
setOutfit(outfit, false);

// drifting sparkles
const SPK = 56, spkGeo = new THREE.BufferGeometry(), spkPos = new Float32Array(SPK * 3), spkCol = new Float32Array(SPK * 3), spkSeed = [];
{ const r = rng(42); for (let i = 0; i < SPK; i++) { spkPos.set([-4.5 + r() * 9.5, 0.3 + r() * 2.6, -4 + r() * 5], i * 3); spkSeed.push(r() * TAU, 0.6 + r() * 1.4, r()); } }
spkGeo.setAttribute('position', new THREE.BufferAttribute(spkPos, 3));
spkGeo.setAttribute('color', new THREE.BufferAttribute(spkCol, 3));
const sparkles = new THREE.Points(spkGeo, new THREE.PointsMaterial({ size: 0.2, map: TEX.sparkle, vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
scene.add(sparkles);

/* ------------------------------------------------------------------ *
 *  HTML overlays projected from 3D
 * ------------------------------------------------------------------ */
const UI = { you: $('plateYou'), aria: $('plateAria'), spell: $('spell'), locks: [$('lock0'), $('lock1'), $('lock2')] };
const _p = new THREE.Vector3();
function toScreen(v) { _p.copy(v).project(camera); return { x: (_p.x + 1) / 2 * W, y: (1 - _p.y) / 2 * H, ok: _p.z < 1 }; }
function pin(el, v, dx = 0, dy = 0, floor = 0) { const s = toScreen(v); let y = s.y + dy; if (floor && s.x > 360 && s.x < 920) y = Math.max(y, floor); el.style.transform = `translate(${s.x + dx}px,${y}px) translate(-50%,-100%)`; el.style.visibility = s.ok ? 'visible' : 'hidden'; }
function pinLock(el, v) { const s = toScreen(v); el.style.transform = `translate(${s.x}px,${s.y}px)`; el.style.visibility = s.ok ? 'visible' : 'hidden'; }
const lockOffsets = [V3(0.1, 0.46, 0.05), V3(0.12, 0.34, 0.05), V3(0.14, 0.28, 0.05)];
// overlays fade out when a doll or prop stands between the camera and their anchor (matters once you orbit)
const ray = new THREE.Raycaster();
let occFrame = 0;
function occluded(el, v) {
  if (occFrame % 6) return;
  const d = camera.position.distanceTo(v);
  ray.set(camera.position, v.clone().sub(camera.position).normalize()); ray.far = d - 0.06;
  el.style.opacity = ray.intersectObjects(occluders, false).length ? '0' : '';
}
function updateOverlays() {
  scene.updateMatrixWorld();
  const a = rival.bones.headC.localToWorld(V3(0, 0.3, 0)), sp = R.target.localToWorld(V3(0, 0.58, 0));
  pin(UI.you, player.bones.headC.localToWorld(V3(0, 0.305, 0)), 0, 0, 122);
  pin(UI.aria, a); occluded(UI.aria, a);
  pin(UI.spell, sp, 0, -4); occluded(UI.spell, R.target.localToWorld(V3(0, 0.3, 0)));
  R.locks.forEach((o, i) => { const v = o.localToWorld(lockOffsets[i].clone()); pinLock(UI.locks[i], v); occluded(UI.locks[i], v); });
  occFrame++;
}

/* ------------------------------------------------------------------ *
 *  Life: idle motion, blinking, sparkles, outfit swap
 * ------------------------------------------------------------------ */
const blink = [{ d: player, next: 1.6 }, { d: rival, next: 2.7 }];
function animateDoll(d, t, ph) {
  const B = d.bones, rp = d.restPose;
  B.body.rotation.z = 0.007 * Math.sin(t * 0.8 + ph);
  B.body.rotation.x = 0.004 * Math.sin(t * 0.6 + ph);
  const br = Math.sin(t * 1.7 + ph);
  B.breath.scale.set(1 + 0.005 * br, 1 + 0.004 * br, 1 + 0.012 * br);
  B.head.rotation.z = rp.head.r.z + 0.02 * Math.sin(t * 0.7 + ph);
  B.head.rotation.x = rp.head.r.x + 0.015 * Math.sin(t * 0.9 + ph + 1);
  B.uarmR.rotation.z = rp.uarmR.r.z - 0.01 * br;
  for (const piv of d.locks) { const q = piv.userData.phase; piv.rotation.z = 0.03 * Math.sin(t * 1.25 + q); piv.rotation.x = 0.02 * Math.sin(t * 1.05 + q * 1.7); }
  if (d.hairPanel) for (const m of d.hairPanel) m.rotation.x = 0.012 * Math.sin(t * 1.1 + ph);
}
function doBlink(t) {
  for (const b of blink) {
    const dt = t - b.next, mat = b.d.faceMat, F = b.d.face;
    let want = F.open;
    if (dt > 0 && dt < 0.06) want = F.half; else if (dt >= 0.06 && dt < 0.15) want = F.shut; else if (dt >= 0.15 && dt < 0.21) want = F.half;
    else if (dt >= 0.21) b.next = t + 2.6 + Math.random() * 2.4;
    if (mat.map !== want) mat.map = want;
  }
}
const clock0 = performance.now();
function tick() {
  const t = (performance.now() - clock0) / 1000;
  animateDoll(player, t, 0); animateDoll(rival, t, 2.1);
  doBlink(t);
  for (const o of popping) {
    o.userData.pop = Math.min(1, o.userData.pop + 0.045);
    const x = o.userData.pop, k = 1 + 2.2 * Math.pow(x - 1, 3) + 1.2 * Math.pow(x - 1, 2);
    o.scale.copy(o.userData.s0).multiplyScalar(0.82 + 0.18 * k);
    if (x >= 1) { o.scale.copy(o.userData.s0); popping.delete(o); }
  }
  for (let i = 0; i < SPK; i++) {
    const [ph, sp, z] = [spkSeed[i * 3], spkSeed[i * 3 + 1], spkSeed[i * 3 + 2]];
    const tw = Math.pow(Math.max(0, Math.sin(t * sp + ph)), 6);
    const c = 0.12 + 1.1 * tw; spkCol[i * 3] = c; spkCol[i * 3 + 1] = c * (0.86 + 0.1 * z); spkCol[i * 3 + 2] = c * 0.94;
    spkPos[i * 3 + 1] += 0.0009 * sp; if (spkPos[i * 3 + 1] > 3.0) spkPos[i * 3 + 1] = 0.25;
  }
  spkGeo.attributes.position.needsUpdate = true; spkGeo.attributes.color.needsUpdate = true;
  const pulse = 0.5 + 0.5 * Math.sin(t * 3.2);
  R.hullMat.opacity = 0.55 + 0.4 * pulse; R.glow.material.opacity = 0.45 + 0.4 * pulse;
  updateOverlays();
  renderer.render(scene, camera);
}
// Software WebGL (e.g. headless SwiftShader) cannot hold 60fps with this scene: there we draw sparsely,
// refresh shadows on demand, and still redraw immediately while the camera is being dragged. GPUs are unaffected.
const glc = renderer.getContext(), dri = glc.getExtension('WEBGL_debug_renderer_info');
const GPU_NAME = String(dri ? glc.getParameter(dri.UNMASKED_RENDERER_WEBGL) : glc.getParameter(glc.RENDERER));
const SOFTWARE = /swiftshader|llvmpipe|software|basic render/i.test(GPU_NAME);
if (SOFTWARE) renderer.shadowMap.autoUpdate = false;
let needDraw = true, lastDraw = -1e9, draws = 0;
controls.addEventListener('change', () => { needDraw = true; });
function frame() {
  controls.update();
  const now = performance.now();
  if (SOFTWARE && !needDraw && !popping.size && now - lastDraw < 1200) return;
  needDraw = false; lastDraw = now;
  if (SOFTWARE) { renderer.shadowMap.needsUpdate = shadowDirty || draws % 4 === 0; shadowDirty = false; }
  draws++;
  tick();
}
renderer.setAnimationLoop(frame);
// draw the complete scene right away and wait for the GPU to finish it, so the very first frame is never blank
frame();
glc.readPixels(0, 0, 1, 1, glc.RGBA, glc.UNSIGNED_BYTE, new Uint8Array(4));

for (const o of [player.root, rival.root, ...R.occ]) o.traverse(m => { if (m.isMesh) occluders.push(m); });
// countdown 09:24, visual only
let remain = 9 * 60 + 24;
setInterval(() => { remain = Math.max(0, remain - 1); $('clock').textContent = String(remain / 60 | 0).padStart(2, '0') + ':' + String(remain % 60).padStart(2, '0'); }, 1000);

// outfit toggle with sparkle burst
const STAR = '<svg viewBox="0 0 24 24"><path d="M12 0C13 8 16 11 24 12 16 13 13 16 12 24 11 16 8 13 0 12 8 11 11 8 12 0Z" fill="#fff"/><circle cx="12" cy="12" r="3" fill="#ffd1e8"/></svg>';
$('swap').addEventListener('click', () => {
  setOutfit(outfit === 'A' ? 'B' : 'A', true);
  const c = toScreen(player.bones.chest.localToWorld(V3(0, 0.05, 0)));
  const f = $('flash'); f.style.setProperty('--fx', c.x + 'px'); f.style.setProperty('--fy', c.y + 'px');
  f.classList.remove('on'); void f.offsetWidth; f.classList.add('on');
  const box = $('sparks');
  for (let i = 0; i < 14; i++) {
    const s = document.createElement('div'); s.className = 'spark'; s.innerHTML = STAR;
    const a = i / 14 * TAU + Math.random() * 0.4, r = 90 + Math.random() * 120;
    s.style.left = c.x + 'px'; s.style.top = (c.y - 40 + Math.random() * 80) + 'px';
    s.style.setProperty('--dx', Math.cos(a) * r + 'px'); s.style.setProperty('--dy', Math.sin(a) * r * 1.3 + 'px'); s.style.setProperty('--s', (0.6 + Math.random() * 0.8).toFixed(2));
    s.style.animationDelay = (Math.random() * 0.12).toFixed(2) + 's';
    box.appendChild(s); setTimeout(() => s.remove(), 1200);
  }
});
</script>
</body>
